services:
  damnfast-api:
    build: .
    container_name: damnfast-api
    restart: unless-stopped
    depends_on:
      damnfast-db:
        condition: service_healthy

    environment:
      - TZ=America/Santiago
      - DB_HOST=damnfast-db
      - DB_NAME=dashboard_db
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - ADMIN_USER=${ADMIN_USER:?Set ADMIN_USER in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}

    networks:
      - cloudflare_net
      - repo_default

    volumes:
      - ./app/assets:/app/app/assets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  damnfast-db:
    image: postgres:15-alpine
    container_name: damnfast-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=dashboard_db
      - POSTGRES_USER=${DB_USER:?Set DB_USER in .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - TZ=America/Santiago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cloudflare_net
      - repo_default

  damnfast-dashboard:
    build:
      context: ./dashboard
    container_name: damnfast-dashboard
    restart: unless-stopped
    environment:
      - DB_HOST=damnfast-db
      - DB_NAME=dashboard_db
      - DB_USER=${DB_USER:?Set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - ADMIN_USER=${ADMIN_USER:?Set ADMIN_USER in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      - TZ=America/Santiago
    depends_on:
      damnfast-db:
        condition: service_healthy
    volumes:
      - ./app/assets:/app/app/assets
      - ./dashboard:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/login', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudflare_net
      - repo_default

  damnfast-nginx:
    image: nginx:1.27-alpine
    container_name: damnfast-nginx
    restart: unless-stopped
    ports:
      - "9005:80"
    depends_on:
      damnfast-api:
        condition: service_healthy
      damnfast-dashboard:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cloudflare_net
      - repo_default

volumes:
  pgdata:

networks:
  cloudflare_net:
    external: true
    name: cloudflare_network
  repo_default:
    external: true
    name: repo_default
