services:
  api-python:
    build: .
    container_name: api-python
    restart: unless-stopped

    environment:
      - TZ=America/Santiago

    networks:
      - cloudflare_net

    volumes:
      - ./app/assets:/app/app/assets

  db-postgres:
    image: postgres:15-alpine
    container_name: db-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=dashboard_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - TZ=America/Santiago
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cloudflare_net

  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard-flask
    restart: unless-stopped
    environment:
      - DB_HOST=db-postgres
      - DB_NAME=dashboard_db
      - DB_USER=postgres
      - DB_PASSWORD=secretpassword
      - FLASK_SECRET_KEY=super-secret-key-13579
      - TZ=America/Santiago
    depends_on:
      - db-postgres
    volumes:
      - ./app/assets:/app/app/assets
    networks:
      - cloudflare_net

  nginx:
    image: nginx:1.27-alpine
    container_name: simpleapi-nginx
    restart: unless-stopped
    ports:
      - "9005:80"
    depends_on:
      - api-python
      - dashboard
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cloudflare_net

volumes:
  pgdata:

networks:
  cloudflare_net:
    external: true
    name: cloudflare_network